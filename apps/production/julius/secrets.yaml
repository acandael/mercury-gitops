apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: julius-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "3deed24f-dd46-4f2d-ae6e-2f11200fc741"
    keyvaultName: "kv-mercury-prod"
    tenantId: "078fd273-e372-4513-8eee-0342373ac232"
    objects: |
      array:
        - |
          objectName: julius-db-user
          objectType: secret
        - |
          objectName: julius-db-password
          objectType: secret
        - |
          objectName: storage-account-name
          objectType: secret
        - |
          objectName: julius-blob-sas
          objectType: secret
        - |
          objectName: julius-telegram-bot-token
          objectType: secret
        - |
          objectName: julius-telegram-chat-id
          objectType: secret
  secretObjects:
    - secretName: julius-db-credentials
      type: kubernetes.io/basic-auth
      data:
        - objectName: julius-db-user
          key: username
        - objectName: julius-db-password
          key: password
    - secretName: julius-n8n-env
      type: Opaque
      data:
        - objectName: julius-db-user
          key: DB_POSTGRESDB_USER
        - objectName: julius-db-password
          key: DB_POSTGRESDB_PASSWORD
    - secretName: julius-backup-creds
      type: Opaque
      data:
        - objectName: storage-account-name
          key: storage-account-name
        - objectName: julius-blob-sas
          key: julius-blob-sas
    - secretName: julius-telegram-creds
      type: Opaque
      data:
        - objectName: julius-telegram-bot-token
          key: TELEGRAM_BOT_TOKEN
        - objectName: julius-telegram-chat-id
          key: TELEGRAM_CHAT_ID
