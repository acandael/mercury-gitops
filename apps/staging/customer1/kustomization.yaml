apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "3caca64d-1523-4521-aa90-51d0f72674b5"
      - op: replace
        path: /spec/parameters/tenantId
        value: "078fd273-e372-4513-8eee-0342373ac232"
  - target:
      kind: ObjectStore
      name: customer1-objectstore
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: "https://mercurybackupsstaging.blob.core.windows.net/customer1"
