apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "d29093fb-bc73-4fef-86cd-f8a90bc2bb18"
      - op: replace
        path: /spec/parameters/tenantId
        value: "078fd273-e372-4513-8eee-0342373ac232"
