apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.26.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
  # Enforce the operator replica count so it can't silently drift to 0
  # (a scaled-to-0 operator leaves cnpg-webhook-service with no endpoints,
  # blocking all new/changed CNPG Clusters while existing DBs keep running).
  driftDetection:
    mode: enabled
  values:
    replicaCount: 1
